<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Book To Sign Translator</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f7f9fc;
            color: #333;
            margin: 0;
            padding: 20px;
        }

        h1, h2 {
            color: #1a73e8;
        }

        form {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }

        input[type="file"] {
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 5px;
            margin-right: 10px;
        }

        button {
            background: #1a73e8;
            color: white;
            padding: 8px 15px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        button:hover {
            background: #1558b0;
        }

        ul {
            background: white;
            padding: 15px;
            border-radius: 8px;
            list-style-type: none;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }

        ul li {
            padding: 8px 0;
            border-bottom: 1px solid #eee;
        }

        ul li:last-child {
            border-bottom: none;
        }

        iframe {
            border: none;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
            margin-top: 15px;
        }
    </style>
</head>
<body>
    <h1>📄 Upload a Book</h1>
    <form method="POST" enctype="multipart/form-data">
        <input type="file" name="file" required>
        <button type="submit">Translate to Sign Language</button>
    </form>

{% if sigml_url %}
  <h2>🧍 Sign Language Animation</h2>
  <iframe src="{{ sigml_url }}" width="100%" height="600px" style="border:none;"></iframe>
{% endif %}

</body>
</html>
